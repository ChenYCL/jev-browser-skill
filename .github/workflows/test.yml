name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-mock-e2e:
    name: unit + e2e (mock Jev, headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && google-chrome --version
      - run: npm test
        env:
          CI: "true"
          JEV_BROWSER_TEST_MODE: mock
